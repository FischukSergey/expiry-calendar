openapi: 3.0.3
info:
  title: Duekeep API
  version: 1.0.0
  description: |
    Календарь обязательств. Канон для проверяющего: GET /docs (Swagger UI).
    Спека сверена со спринтами 1–6. Sprint 7: register → admin и свои категории (без seed-items);
    items/categories/audit/dashboard/calendar/notifications — только свой owner_id (в JSON не отдаём).
    Нет org_id, инвайтов и ручек /org.
    Access: Authorization Bearer. Refresh: JSON body и/или cookie duekeep_refresh (body важнее).
servers:
  - url: /
    description: Тот же origin (frontend :80 или backend :8080)
tags:
  - name: Health
    description: Liveness и доступность PostgreSQL
  - name: Docs
    description: OpenAPI и Swagger UI
  - name: Auth
    description: Регистрация, вход, refresh, logout, /me
  - name: Catalog
    description: kinds — общий справочник; categories — только свои (owner_id)
  - name: Items
    description: Записи обязательств, продление, bulk, CSV
  - name: Audit
    description: Журнал мутаций (admin)
  - name: Notifications
    description: In-app лента переходов в expiring/expired
  - name: Events
    description: SSE (вкладка открыта)
  - name: Push
    description: Web Push (VAPID), вкладка закрыта
  - name: Overview
    description: Дашборд и календарь (JSON)
paths:
  /healthz:
    get:
      tags: [Health]
      summary: Проверка процесса и БД
      operationId: getHealthz
      security: []
      responses:
        "200":
          description: Процесс жив и видит PostgreSQL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOK"
              example:
                status: ok
        "503":
          description: База недоступна
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: internal
                  message: database unavailable
  /openapi.yaml:
    get:
      tags: [Docs]
      summary: Сырой OpenAPI-документ
      operationId: getOpenAPISpec
      security: []
      responses:
        "200":
          description: YAML
          content:
            application/yaml:
              schema:
                type: string
  /docs:
    get:
      tags: [Docs]
      summary: Swagger UI
      operationId: getDocs
      security: []
      responses:
        "200":
          description: HTML
          content:
            text/html:
              schema:
                type: string
        "302":
          description: Редирект на /docs/
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Регистрация admin + пара токенов
      description: |
        Роль admin, копия дефолтных категорий (свои UUID), без seed-items и без invite_token.
      operationId: postAuthRegister
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailPassword"
      responses:
        "201":
          description: Пара токенов, роль admin
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "409":
          description: Email занят
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Валидация email/пароля
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Вход
      operationId: postAuthLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailPassword"
      responses:
        "200":
          description: Пара токенов + cookie duekeep_refresh
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          description: Неверный email или пароль
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Новая пара по refresh (body важнее cookie)
      operationId: postAuthRefresh
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshCookie"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Новая пара; старый refresh мёртв
          headers:
            Set-Cookie:
              description: Новая duekeep_refresh; HttpOnly; Path=/api/v1/auth; SameSite=Lax
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          description: Неизвестный, просроченный, revoked или reuse family
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke текущего refresh (access и/или refresh)
      operationId: postAuthLogout
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshCookie"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Идемпотентно, в том числе если refresh уже мёртв
        "401":
          description: Нет ни access, ни refresh
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/logout-all:
    post:
      tags: [Auth]
      summary: Revoke всех refresh пользователя
      operationId: postAuthLogoutAll
      responses:
        "204":
          description: Все семьи отозваны
        "401":
          description: Нет access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me:
    get:
      tags: [Auth]
      summary: Текущий пользователь
      description: id, email, role. Полей org_id / org_name нет.
      operationId: getMe
      responses:
        "200":
          description: id, email, role без org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUser"
        "401":
          description: Нет или битый access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/kinds:
    get:
      tags: [Catalog]
      summary: Список типов записей
      operationId: getKinds
      responses:
        "200":
          description: Без пагинации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KindList"
        "401":
          description: Нет access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Catalog]
      summary: Создать тип (admin)
      operationId: postKinds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KindWrite"
      responses:
        "201":
          description: Созданный kind
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kind"
        "403":
          description: Viewer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Slug занят
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: slug / name / color / attr_schema
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/kinds/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Catalog]
      summary: Частичное обновление типа (admin)
      operationId: patchKind
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KindPatch"
      responses:
        "200":
          description: Обновлённый kind
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kind"
        "403":
          description: Viewer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Нет такого id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Slug занят
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Валидация полей
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Catalog]
      summary: Удалить тип (admin)
      operationId: deleteKind
      responses:
        "204":
          description: Удалён
        "403":
          description: Viewer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Нет такого id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Есть items (Sprint 3)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/categories:
    get:
      tags: [Catalog]
      summary: Дерево своих категорий (корни в items)
      operationId: getCategories
      responses:
        "200":
          description: Корни с вложенными children
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryList"
        "401":
          description: Нет access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Catalog]
      summary: Создать категорию (admin)
      operationId: postCategories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryWrite"
      responses:
        "201":
          description: Созданный узел
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "403":
          description: Viewer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: parent_id не найден
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Имя или глубина > 3
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/categories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Catalog]
      summary: Имя, порядок или родитель (admin)
      operationId: patchCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryPatch"
      responses:
        "200":
          description: Обновлённый узел
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "403":
          description: Viewer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Нет id или нового родителя
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Цикл или глубина > 3
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Catalog]
      summary: Удалить категорию (admin)
      operationId: deleteCategory
      responses:
        "204":
          description: Удалена
        "403":
          description: Viewer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Нет такого id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Есть дети или items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/items:
    get:
      tags: [Items]
      summary: Список своих записей
      operationId: listItems
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: kind_id
          schema: { type: string, format: uuid }
        - in: query
          name: status
          schema:
            type: string
            enum: [active, expiring, expired, cancelled, archived, paid]
        - in: query
          name: category_id
          schema: { type: string, format: uuid }
        - in: query
          name: vendor
          schema: { type: string }
        - in: query
          name: expires_from
          schema: { type: string, format: date }
        - in: query
          name: expires_to
          schema: { type: string, format: date }
        - in: query
          name: cost_from
          schema: { type: integer }
        - in: query
          name: cost_to
          schema: { type: integer }
        - in: query
          name: billing_period
          schema:
            type: string
            enum: [one_time, monthly, yearly]
        - in: query
          name: tag
          schema: { type: string }
        - in: query
          name: sort
          schema:
            type: string
            enum: [expires_at, cost_amount, title, updated_at]
        - in: query
          name: order
          schema:
            type: string
            enum: [asc, desc]
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Страница
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Items]
      summary: Создать запись (admin)
      operationId: createItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemWrite"
      responses:
        "201":
          description: Создана, status уже посчитан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /api/v1/items/bulk:
    post:
      tags: [Items]
      summary: Массовое обновление (admin)
      operationId: bulkItems
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemBulk"
      responses:
        "200":
          description: Сколько строк обновлено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkResult"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /api/v1/items/export:
    get:
      tags: [Items]
      summary: Экспорт CSV своих записей (фильтр как у списка)
      operationId: exportItems
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: kind_id
          schema: { type: string, format: uuid }
        - in: query
          name: status
          schema:
            type: string
            enum: [active, expiring, expired, cancelled, archived, paid]
        - in: query
          name: category_id
          schema: { type: string, format: uuid }
        - in: query
          name: vendor
          schema: { type: string }
        - in: query
          name: expires_from
          schema: { type: string, format: date }
        - in: query
          name: expires_to
          schema: { type: string, format: date }
        - in: query
          name: cost_from
          schema: { type: integer }
        - in: query
          name: cost_to
          schema: { type: integer }
        - in: query
          name: billing_period
          schema:
            type: string
            enum: [one_time, monthly, yearly]
        - in: query
          name: tag
          schema: { type: string }
        - in: query
          name: sort
          schema:
            type: string
            enum: [expires_at, cost_amount, title, updated_at]
        - in: query
          name: order
          schema:
            type: string
            enum: [asc, desc]
      responses:
        "200":
          description: text/csv, до 10_000 строк
          content:
            text/csv:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/items/import:
    post:
      tags: [Items]
      summary: Импорт CSV (admin)
      operationId: importItems
      parameters:
        - in: query
          name: dry_run
          schema:
            type: boolean
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, mapping]
              properties:
                file:
                  type: string
                  format: binary
                mapping:
                  type: string
                  description: JSON объект поле → колонка CSV, включая attrs.*
      responses:
        "200":
          description: dry_run — превью; иначе {created}
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CSVImportPreview"
                  - $ref: "#/components/schemas/CSVImportResult"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /api/v1/items/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [Items]
      summary: Своя карточка и renewals; чужой id → 404
      operationId: getItem
      responses:
        "200":
          description: Карточка
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemCard"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Items]
      summary: Частичное обновление (admin)
      operationId: patchItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemPatch"
      responses:
        "200":
          description: Обновлённая запись
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      tags: [Items]
      summary: Удалить (admin)
      operationId: deleteItem
      responses:
        "204":
          description: Удалена
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/items/{id}/renew:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [Items]
      summary: Продлить (admin)
      operationId: renewItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemRenew"
      responses:
        "200":
          description: Обновлённый item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /api/v1/items/{id}/payments:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [Items]
      summary: Отметить оплату вхождения (admin)
      operationId: payItemOccurrence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemPaymentWrite"
      responses:
        "201":
          description: Новая отметка
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPayment"
        "200":
          description: Повтор на ту же дату — та же строка
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPayment"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      tags: [Items]
      summary: Снять оплату вхождения (admin)
      operationId: unpayItemOccurrence
      parameters:
        - in: query
          name: date
          required: true
          schema:
            type: string
            format: date
      responses:
        "204":
          description: Снято или строки не было
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /api/v1/audit:
    get:
      tags: [Audit]
      summary: Свой журнал (admin)
      operationId: listAudit
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Страница audit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditList"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/notifications:
    get:
      tags: [Notifications]
      summary: Своя лента уведомлений
      operationId: listNotifications
      parameters:
        - in: query
          name: unread
          schema:
            type: boolean
          description: true — только без read_at
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Страница
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/notifications/read-all:
    post:
      tags: [Notifications]
      summary: Пометить свои непрочитанные
      operationId: readAllNotifications
      responses:
        "204":
          description: Готово
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/notifications/{id}/read:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [Notifications]
      summary: Пометить прочитанным
      operationId: readNotification
      responses:
        "204":
          description: Прочитано
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /api/v1/events:
    get:
      tags: [Events]
      summary: SSE: только свои notification
      operationId: streamEvents
      parameters:
        - in: query
          name: access_token
          schema:
            type: string
          description: Access JWT, если нет Authorization (ограничение EventSource)
      responses:
        "200":
          description: text/event-stream, события notification и ping
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: ping
                data: {}

                event: notification
                data: {"id":"...","item_id":"...","to_status":"expiring","title":"..."}
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/push/vapid-public:
    get:
      tags: [Push]
      summary: Публичный VAPID для pushManager.subscribe
      operationId: getVapidPublic
      responses:
        "200":
          description: Ключ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VAPIDPublic"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/push/subscribe:
    post:
      tags: [Push]
      summary: Сохранить Web Push subscription
      operationId: subscribePush
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscribe"
      responses:
        "204":
          description: Upsert по endpoint
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      tags: [Push]
      summary: Снять подписку по endpoint
      operationId: unsubscribePush
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushUnsubscribe"
      responses:
        "204":
          description: Снято (нет строки — тоже 204)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /api/v1/dashboard:
    get:
      tags: [Overview]
      summary: KPI и series по своим записям
      operationId: getDashboard
      responses:
        "200":
          description: Агрегаты; суммы по валютам отдельно
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/calendar:
    get:
      tags: [Overview]
      summary: Свои обязательства за календарный месяц
      operationId: getCalendar
      parameters:
        - in: query
          name: year
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 9999
        - in: query
          name: month
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
      responses:
        "200":
          description: Дни с записями; пустые дни можно не включать
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Calendar"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    RefreshCookie:
      name: duekeep_refresh
      in: cookie
      required: false
      description: HttpOnly; Path=/api/v1/auth; SameSite=Lax. На локали без Secure.
      schema:
        type: string
  responses:
    Unauthorized:
      description: Нет или битый access
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Viewer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Нет такого id
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unprocessable:
      description: Валидация
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthOK:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    EmailPassword:
      type: object
      description: Login и register. Поля invite_token нет.
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 8
    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
          description: Opaque refresh. Если поле непустое — важнее cookie duekeep_refresh.
    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 900
    PublicUser:
      type: object
      description: GET /me. org_id и org_name не входят в контракт.
      required: [id, email, role]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [admin, viewer]
    AttrField:
      type: object
      required: [key, label, type, required]
      properties:
        key:
          type: string
        label:
          type: string
        type:
          type: string
          enum: [string, number, boolean]
        required:
          type: boolean
    Kind:
      type: object
      required: [id, slug, name, color, attr_schema]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        color:
          type: string
        attr_schema:
          type: array
          items:
            $ref: "#/components/schemas/AttrField"
    KindList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Kind"
    KindWrite:
      type: object
      required: [slug, name, color]
      properties:
        slug:
          type: string
        name:
          type: string
        color:
          type: string
        attr_schema:
          type: array
          items:
            $ref: "#/components/schemas/AttrField"
    KindPatch:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        color:
          type: string
        attr_schema:
          type: array
          items:
            $ref: "#/components/schemas/AttrField"
    Category:
      type: object
      required: [id, name, sort_order, children]
      properties:
        id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        sort_order:
          type: integer
        children:
          type: array
          items:
            $ref: "#/components/schemas/Category"
    CategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Category"
    CategoryWrite:
      type: object
      required: [name]
      properties:
        parent_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        sort_order:
          type: integer
    CategoryPatch:
      type: object
      properties:
        name:
          type: string
        sort_order:
          type: integer
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: null — сделать корнем; отсутствие поля — не менять
    APIError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/APIError"
    Item:
      type: object
      description: owner_id в ответе нет; сервер фильтрует по sub.
      required: [id, title, kind_id, expires_at, status, attrs]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        kind_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
          nullable: true
        vendor:
          type: string
        tags:
          type: array
          items:
            type: string
        cost_amount:
          type: integer
          minimum: 0
        currency:
          type: string
          minLength: 3
          maxLength: 3
        billing_period:
          type: string
          enum: [one_time, monthly, yearly]
        started_at:
          type: string
          format: date
          nullable: true
        expires_at:
          type: string
          format: date
        notify_before_days:
          type: integer
          minimum: 0
          nullable: true
        url:
          type: string
        account_hint:
          type: string
        status:
          type: string
          enum: [active, expiring, expired, cancelled, archived, paid]
        attrs:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ItemList:
      type: object
      required: [items, page, per_page, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
    ItemCard:
      type: object
      required: [item, renewals, next_open_at]
      properties:
        item:
          $ref: "#/components/schemas/Item"
        renewals:
          type: array
          items:
            $ref: "#/components/schemas/Renewal"
        next_open_at:
          type: string
          format: date
          nullable: true
          description: Ближайшее open-вхождение; null при заморозке paid или если open нет
    ItemPaymentWrite:
      type: object
      required: [date]
      properties:
        date:
          type: string
          format: date
    ItemPayment:
      type: object
      required: [id, item_id, date, amount, currency]
      properties:
        id:
          type: string
          format: uuid
        item_id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        amount:
          type: integer
        currency:
          type: string
    ItemWrite:
      type: object
      required: [title, kind_id, expires_at]
      properties:
        title:
          type: string
        description:
          type: string
        kind_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
          nullable: true
        vendor:
          type: string
        tags:
          type: array
          items:
            type: string
        cost_amount:
          type: integer
          minimum: 0
        currency:
          type: string
          default: RUB
        billing_period:
          type: string
          enum: [one_time, monthly, yearly]
          default: one_time
        started_at:
          type: string
          format: date
        expires_at:
          type: string
          format: date
        notify_before_days:
          type: integer
          minimum: 0
          nullable: true
          default: 30
        url:
          type: string
        account_hint:
          type: string
        status:
          type: string
          enum: [cancelled, archived, paid]
          description: Остальные статусы считает сервер
        attrs:
          type: object
          additionalProperties: true
    ItemPatch:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        kind_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
          nullable: true
        vendor:
          type: string
        tags:
          type: array
          items:
            type: string
        cost_amount:
          type: integer
        currency:
          type: string
        billing_period:
          type: string
          enum: [one_time, monthly, yearly]
        started_at:
          type: string
          format: date
          nullable: true
        expires_at:
          type: string
          format: date
        notify_before_days:
          type: integer
          minimum: 0
          nullable: true
        url:
          type: string
        account_hint:
          type: string
        status:
          type: string
          enum: [cancelled, archived, paid]
        attrs:
          type: object
          additionalProperties: true
    ItemRenew:
      type: object
      required: [new_expires_at]
      properties:
        new_expires_at:
          type: string
          format: date
        new_cost:
          type: integer
          minimum: 0
        comment:
          type: string
    ItemBulk:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items:
            type: string
            format: uuid
        category_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [cancelled, archived, paid]
    BulkResult:
      type: object
      required: [updated]
      properties:
        updated:
          type: integer
    CSVImportError:
      type: object
      required: [line, message]
      properties:
        line:
          type: integer
        message:
          type: string
    CSVImportPreview:
      type: object
      required: [rows, valid, errors, preview]
      properties:
        rows:
          type: integer
        valid:
          type: integer
        errors:
          type: array
          items:
            $ref: "#/components/schemas/CSVImportError"
        preview:
          type: array
          items:
            type: object
    CSVImportResult:
      type: object
      required: [created]
      properties:
        created:
          type: integer
    Renewal:
      type: object
      properties:
        id:
          type: string
          format: uuid
        item_id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
        old_expires_at:
          type: string
          format: date
        new_expires_at:
          type: string
          format: date
        old_cost:
          type: integer
        new_cost:
          type: integer
        comment:
          type: string
        created_at:
          type: string
          format: date-time
    AuditEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
          nullable: true
        action:
          type: string
        entity:
          type: string
        entity_id:
          type: string
          format: uuid
        before_json:
          nullable: true
        after_json:
          nullable: true
        created_at:
          type: string
          format: date-time
    AuditList:
      type: object
      required: [items, page, per_page, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
    Notification:
      type: object
      required: [id, item_id, to_status, title, created_at]
      properties:
        id:
          type: string
          format: uuid
        item_id:
          type: string
          format: uuid
        to_status:
          type: string
          enum: [expiring, expired]
        title:
          type: string
        read_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    NotificationList:
      type: object
      required: [items, page, per_page, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
    VAPIDPublic:
      type: object
      required: [public_key]
      properties:
        public_key:
          type: string
    PushSubscribe:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint:
          type: string
          format: uri
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh:
              type: string
            auth:
              type: string
    PushUnsubscribe:
      type: object
      required: [endpoint]
      properties:
        endpoint:
          type: string
          format: uri
    Dashboard:
      type: object
      required: [counts, upcoming_cost, expirations_by_month, cost_by_kind, soonest]
      properties:
        counts:
          type: object
          required: [active, expiring_7, expiring_30, expired]
          properties:
            active:
              type: integer
            expiring_7:
              type: integer
            expiring_30:
              type: integer
            expired:
              type: integer
        upcoming_cost:
          type: array
          items:
            type: object
            required: [currency, monthly, yearly]
            properties:
              currency:
                type: string
              monthly:
                type: integer
              yearly:
                type: integer
        expirations_by_month:
          type: array
          description: Текущий месяц UTC и следующие 5. count — число записей; amounts — сумма cost_amount по валютам, без конвертации.
          items:
            type: object
            required: [month, count, amounts]
            properties:
              month:
                type: string
                example: "2026-09"
              count:
                type: integer
              amounts:
                type: array
                items:
                  type: object
                  required: [currency, amount]
                  properties:
                    currency:
                      type: string
                    amount:
                      type: integer
        cost_by_kind:
          type: array
          items:
            type: object
            required: [kind_id, currency, amount]
            properties:
              kind_id:
                type: string
                format: uuid
              currency:
                type: string
              amount:
                type: integer
        soonest:
          type: array
          items:
            $ref: "#/components/schemas/DashboardItem"
    DashboardItem:
      type: object
      required: [id, title, expires_at, status, kind_id]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        expires_at:
          type: string
        status:
          type: string
        kind_id:
          type: string
          format: uuid
    Calendar:
      type: object
      required: [year, month, days]
      properties:
        year:
          type: integer
        month:
          type: integer
        days:
          type: array
          items:
            $ref: "#/components/schemas/CalendarDay"
    CalendarDay:
      type: object
      required: [date, items]
      properties:
        date:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/CalendarItem"
    CalendarItem:
      type: object
      required: [id, title, status, occurrence_status, cost_amount, currency]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
          description: Статус записи
        occurrence_status:
          type: string
          enum: [open, paid]
        cost_amount:
          type: integer
        currency:
          type: string
security:
  - bearerAuth: []
