openapi: 3.0.3
info:
  title: Duekeep API
  version: 0.2.0
  description: |
    Календарь истечений. Спека растёт вместе со спринтами, без кодогенерации.
    Sprint 2: JWT access + refresh, CRUD kinds и categories.
servers:
  - url: /
    description: Тот же origin (frontend :80 или backend :8080)
tags:
  - name: Health
    description: Liveness и доступность PostgreSQL
  - name: Docs
    description: OpenAPI и Swagger UI
  - name: Auth
    description: Регистрация, вход, refresh, logout, /me
  - name: Catalog
    description: Общие справочники kinds и categories (не per-user)
paths:
  /healthz:
    get:
      tags: [Health]
      summary: Проверка процесса и БД
      operationId: getHealthz
      security: []
      responses:
        "200":
          description: Процесс жив и видит PostgreSQL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOK"
              example:
                status: ok
        "503":
          description: База недоступна
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: internal
                  message: database unavailable
  /openapi.yaml:
    get:
      tags: [Docs]
      summary: Сырой OpenAPI-документ
      operationId: getOpenAPISpec
      security: []
      responses:
        "200":
          description: YAML
          content:
            application/yaml:
              schema:
                type: string
  /docs:
    get:
      tags: [Docs]
      summary: Swagger UI
      operationId: getDocs
      security: []
      responses:
        "200":
          description: HTML
          content:
            text/html:
              schema:
                type: string
        "302":
          description: Редирект на /docs/
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Регистрация viewer + пара токенов
      operationId: postAuthRegister
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailPassword"
      responses:
        "201":
          description: Пара токенов, роль viewer
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "409":
          description: Email занят
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Валидация email/пароля
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Вход
      operationId: postAuthLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailPassword"
      responses:
        "200":
          description: Пара токенов + cookie duekeep_refresh
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          description: Неверный email или пароль
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Новая пара по refresh (body важнее cookie)
      operationId: postAuthRefresh
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Новая пара; старый refresh мёртв
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          description: Неизвестный, просроченный, revoked или reuse family
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke текущего refresh (access и/или refresh)
      operationId: postAuthLogout
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Идемпотентно, в том числе если refresh уже мёртв
        "401":
          description: Нет ни access, ни refresh
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/logout-all:
    post:
      tags: [Auth]
      summary: Revoke всех refresh пользователя
      operationId: postAuthLogoutAll
      responses:
        "204":
          description: Все семьи отозваны
        "401":
          description: Нет access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me:
    get:
      tags: [Auth]
      summary: Текущий пользователь
      operationId: getMe
      responses:
        "200":
          description: id, email, role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUser"
        "401":
          description: Нет или битый access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/kinds:
    get:
      tags: [Catalog]
      summary: Список типов записей
      operationId: getKinds
      responses:
        "200":
          description: Без пагинации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KindList"
        "401":
          description: Нет access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Catalog]
      summary: Создать тип (admin)
      operationId: postKinds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KindWrite"
      responses:
        "201":
          description: Созданный kind
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kind"
        "403":
          description: Viewer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Slug занят
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: slug / name / color / attr_schema
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/kinds/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Catalog]
      summary: Частичное обновление типа (admin)
      operationId: patchKind
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KindPatch"
      responses:
        "200":
          description: Обновлённый kind
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kind"
        "403":
          description: Viewer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Нет такого id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Slug занят
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Валидация полей
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Catalog]
      summary: Удалить тип (admin)
      operationId: deleteKind
      responses:
        "204":
          description: Удалён
        "403":
          description: Viewer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Нет такого id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Есть items (Sprint 3)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/categories:
    get:
      tags: [Catalog]
      summary: Дерево категорий (корни в items)
      operationId: getCategories
      responses:
        "200":
          description: Корни с вложенными children
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryList"
        "401":
          description: Нет access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Catalog]
      summary: Создать категорию (admin)
      operationId: postCategories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryWrite"
      responses:
        "201":
          description: Созданный узел
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "403":
          description: Viewer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: parent_id не найден
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Имя или глубина > 3
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/categories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Catalog]
      summary: Имя, порядок или родитель (admin)
      operationId: patchCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryPatch"
      responses:
        "200":
          description: Обновлённый узел
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "403":
          description: Viewer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Нет id или нового родителя
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Цикл или глубина > 3
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Catalog]
      summary: Удалить категорию (admin)
      operationId: deleteCategory
      responses:
        "204":
          description: Удалена
        "403":
          description: Viewer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Нет такого id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Есть дети или items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthOK:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    EmailPassword:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 8
    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 900
    PublicUser:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [admin, viewer]
    AttrField:
      type: object
      required: [key, label, type, required]
      properties:
        key:
          type: string
        label:
          type: string
        type:
          type: string
          enum: [string, number, boolean]
        required:
          type: boolean
    Kind:
      type: object
      required: [id, slug, name, color, attr_schema]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        color:
          type: string
        attr_schema:
          type: array
          items:
            $ref: "#/components/schemas/AttrField"
    KindList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Kind"
    KindWrite:
      type: object
      required: [slug, name, color]
      properties:
        slug:
          type: string
        name:
          type: string
        color:
          type: string
        attr_schema:
          type: array
          items:
            $ref: "#/components/schemas/AttrField"
    KindPatch:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        color:
          type: string
        attr_schema:
          type: array
          items:
            $ref: "#/components/schemas/AttrField"
    Category:
      type: object
      required: [id, name, sort_order, children]
      properties:
        id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        sort_order:
          type: integer
        children:
          type: array
          items:
            $ref: "#/components/schemas/Category"
    CategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Category"
    CategoryWrite:
      type: object
      required: [name]
      properties:
        parent_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        sort_order:
          type: integer
    CategoryPatch:
      type: object
      properties:
        name:
          type: string
        sort_order:
          type: integer
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: null — сделать корнем; отсутствие поля — не менять
    APIError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/APIError"
security:
  - bearerAuth: []
