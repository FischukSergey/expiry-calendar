name: duekeep

x-labels: &common-labels
  labels:
    com.duekeep.project: duekeep
    com.duekeep.env: local

services:
  db:
    image: postgres:16-alpine
    container_name: duekeep-db-local
    <<: *common-labels
    environment:
      POSTGRES_USER: duekeep
      POSTGRES_PASSWORD: duekeep
      POSTGRES_DB: duekeep
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duekeep -d duekeep"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../../backend
    container_name: duekeep-backend-local
    <<: *common-labels
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://duekeep:duekeep@db:5432/duekeep?sslmode=disable
      HTTP_ADDR: ":8080"
      JWT_SECRET: dev-only-change-me
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 336h
      # Локальные ключи, как JWT_SECRET. Не прод.
      VAPID_PUBLIC: BF_BtS_tvLDpsYbIYChfAdPOiwy1PKS-Se-JzRZWG5hAExv9Fp3x8DWaNnKcw9167vY3-fixphFlAeKhmXMajas
      VAPID_PRIVATE: KlOo42SRQIP-WLodpzLKX_MDcNP0nKqZ_3zlXcxhfLk
      VAPID_SUBJECT: mailto:dev@duekeep.local
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../../frontend
    container_name: duekeep-frontend-local
    <<: *common-labels
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
    name: duekeep-pgdata-local
