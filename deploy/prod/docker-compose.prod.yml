name: duekeep-prod

# Секреты только из корневого .env (не коммитить).
#   docker compose -f deploy/prod/docker-compose.prod.yml --env-file .env up -d

x-labels: &common-labels
  labels:
    com.duekeep.project: duekeep
    com.duekeep.env: prod

x-restart: &restart
  restart: unless-stopped

x-depends-db: &depends-db
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    container_name: duekeep-db-prod
    <<: [*common-labels, *restart]
    env_file:
      - ../../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - duekeep-net

  backend:
    build:
      context: ../../backend
    container_name: duekeep-backend-prod
    <<: [*common-labels, *restart, *depends-db]
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      HTTP_ADDR: ":8080"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-336h}
      VAPID_PUBLIC: ${VAPID_PUBLIC:-}
      VAPID_PRIVATE: ${VAPID_PRIVATE:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:?set VAPID_SUBJECT in .env}
    # /healthz появится в Sprint 1 §3; до этого healthcheck не ставим.
    networks:
      - duekeep-net

  frontend:
    build:
      context: ../../frontend
    container_name: duekeep-frontend-prod
    <<: [*common-labels, *restart]
    depends_on:
      - backend
    networks:
      - duekeep-net

  nginx:
    image: nginx:1.27-alpine
    container_name: duekeep-nginx-prod
    <<: [*common-labels, *restart]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    networks:
      - duekeep-net

  certbot:
    image: certbot/certbot:latest
    container_name: duekeep-certbot-prod
    <<: *common-labels
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"
    networks:
      - duekeep-net

  nginx-reloader:
    image: docker:cli
    container_name: duekeep-nginx-reloader-prod
    <<: [*common-labels, *restart]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: >
      /bin/sh -c "while :; do
        sleep 12h;
        docker exec duekeep-nginx-prod nginx -s reload && echo 'nginx reloaded' || echo 'nginx reload failed';
      done"
    depends_on:
      - nginx

networks:
  duekeep-net:
    driver: bridge

volumes:
  postgres-data:
    name: duekeep-postgres-data-prod
