name: duekeep-test

# Только Postgres. Integration-тесты подключим в Taskfile позже.
services:
  postgres-test:
    image: postgres:16-alpine
    container_name: duekeep-postgres-test
    environment:
      POSTGRES_USER: duekeep
      POSTGRES_PASSWORD: duekeep
      POSTGRES_DB: duekeep_test
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duekeep -d duekeep_test"]
      interval: 2s
      timeout: 3s
      retries: 15
